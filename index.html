<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8e8ec"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Daily Bloom"><title>My Daily Bloom 🌸</title><link rel="manifest" href="manifest.webmanifest"><style>body{margin:0;background:#fff9f5;color:#51434b;font:16px -apple-system,BlinkMacSystemFont,sans-serif}.wrap{max-width:620px;margin:auto;padding:24px 18px 80px}header{text-align:center;background:linear-gradient(145deg,#f9dfe8,#e7f1e5);border-radius:24px;padding:28px 12px}h1{font-family:Georgia,serif;margin:0;font-size:32px}h2{font:24px Georgia,serif;margin:24px 0 10px}.sub{color:#806c77}.card{background:white;border:1px solid #f1e4e7;border-radius:18px;padding:18px;margin-top:16px;box-shadow:0 4px 16px #6546550b}.bar{height:10px;background:#f4e6eb;border-radius:20px;overflow:hidden}.fill{height:100%;background:#86a98f;width:0;transition:width .2s}.task{display:flex;align-items:center;gap:10px;border-bottom:1px solid #f5edf0;padding:12px 0}.task:last-child{border:0}.task input{width:22px;height:22px;accent-color:#86a98f}.task .name{flex:1}.done{text-decoration:line-through;opacity:.55}.pill{font-size:12px;color:#866577;background:#faedf1;padding:5px 9px;border-radius:20px}.delete{border:0;background:transparent;color:#aa687d;font-size:22px}.controls{display:flex;gap:8px;flex-wrap:wrap}input[type=text],select{border:1px solid #ead7dd;border-radius:12px;padding:12px;font-size:16px;background:white;min-width:0}#newTask{flex:1;min-width:140px}button.add{background:#8aa990;color:white;border:0;border-radius:12px;padding:12px 18px;font-weight:700}button.tab{border:1px solid #e8d5de;background:#fff;border-radius:20px;padding:9px 12px;color:#795f6b}button.tab.active{background:#f5dce6}small{color:#8c7a83}footer{text-align:center;margin-top:30px;color:#927e87}</style></head><body><main class="wrap"><header><div style="font-size:36px">🌸 🌿 🌷</div><h1>My Daily Bloom</h1><p class="sub">A little progress, every day ✨</p><div id="today"></div></header><section class="card"><strong id="progressLabel">0 of 0 completed</strong><div class="bar" style="margin-top:12px"><div class="fill" id="fill"></div></div></section><h2>My checklist 🌼</h2><div class="controls" id="tabs"></div><section class="card"><form id="form" class="controls"><input id="newTask" type="text" placeholder="Add a new task…" maxlength="120" required aria-label="New task"><select id="category" aria-label="Category"><option>Personal</option><option>Work</option><option>Home</option><option>Kids</option><option>Quran</option></select><select id="repeat" aria-label="Repeat"><option value="once">One time</option><option value="daily">Daily</option><option value="weekly">Weekly</option></select><button class="add">+ Add</button></form><div id="tasks"></div></section><footer>Made with care ♡ Your tasks stay on this device.<p><small>For backup, keep a copy of important tasks elsewhere. Clearing Safari website data can erase saved tasks.</small></p></footer></main><script>const KEY='daily-bloom-v1';const categories=['All','Personal','Work','Home','Kids','Quran'];let filter='All';let tasks=[];try{tasks=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(tasks))tasks=[]}catch(e){tasks=[]}const localDay=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const today=()=>localDay(new Date());const week=d=>{const x=new Date(d+'T12:00:00');x.setDate(x.getDate()-((x.getDay()+6)%7));return localDay(x)};const period=t=>t.repeat==='daily'?today():t.repeat==='weekly'?week(today()):'once';const checked=t=>t.completed===period(t);const save=()=>localStorage.setItem(KEY,JSON.stringify(tasks));function render(){document.getElementById('today').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});const active=tasks.filter(t=>t.repeat!=='once'||!t.completed||t.completed==='once');const count=active.filter(checked).length;document.getElementById('progressLabel').textContent=`${count} of ${active.length} completed`;document.getElementById('fill').style.width=(active.length?count/active.length*100:0)+'%';document.getElementById('tabs').replaceChildren(...categories.map(c=>{let b=document.createElement('button');b.className='tab'+(filter===c?' active':'');b.textContent=c;b.onclick=()=>{filter=c;render()};return b}));const target=document.getElementById('tasks');target.replaceChildren();const shown=tasks.filter(t=>filter==='All'||t.category===filter);if(!shown.length){const p=document.createElement('p');p.className='sub';p.textContent='No tasks yet. Add your first little goal 🌷';target.append(p)}shown.forEach(t=>{const row=document.createElement('div');row.className='task';const cb=document.createElement('input');cb.type='checkbox';cb.checked=checked(t);cb.setAttribute('aria-label','Complete '+t.name);cb.onchange=()=>{t.completed=cb.checked?period(t):null;save();render()};const name=document.createElement('span');name.className='name'+(checked(t)?' done':'');name.textContent=t.name;const tag=document.createElement('span');tag.className='pill';tag.textContent=t.category+(t.repeat==='once'?'':' · '+t.repeat);const del=document.createElement('button');del.className='delete';del.textContent='×';del.setAttribute('aria-label','Delete '+t.name);del.onclick=()=>{if(confirm('Delete this task?')){tasks=tasks.filter(x=>x.id!==t.id);save();render()}};row.append(cb,name,tag,del);target.append(row)})}document.getElementById('form').onsubmit=e=>{e.preventDefault();const name=document.getElementById('newTask').value.trim();if(!name)return;tasks.unshift({id:Date.now()+'-'+Math.random(),name,category:document.getElementById('category').value,repeat:document.getElementById('repeat').value,completed:null});save();document.getElementById('newTask').value='';render()};render();document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
